name: Build et déploiement
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, include-hidden-files: true, retention-days: 3 }

  # Envoie dist/ sur l'hébergement Infomaniak à chaque modification de main
  # (y compris celles faites depuis l'admin). Ne s'exécute que si les secrets sont configurés.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.INFOMANIAK_HOST }}
      USER: ${{ secrets.INFOMANIAK_USER }}
      DEST: ${{ secrets.INFOMANIAK_PATH }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$DEST" ]; then
            echo "Secrets Infomaniak absents : déploiement ignoré (voir docs/ARCHITECTURE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { name: dist, path: dist }
      - name: Envoyer sur Infomaniak (rsync over SSH)
        if: steps.cfg.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Retire les fins de ligne Windows et les espaces parasites copiés avec les secrets
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          HOST=$(printf '%s' "$HOST" | tr -d ' \r\n'); USER=$(printf '%s' "$USER" | tr -d ' \r\n')
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || {
            echo "::error::INFOMANIAK_SSH_KEY illisible : coller tout le fichier de clé privée (imavaita_deploy, sans .pub), lignes BEGIN et END comprises."
            exit 1
          }
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -rlvz --delete --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/id_deploy" dist/ "$USER@$HOST:$DEST/"
