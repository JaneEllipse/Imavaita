name: Build et déploiement
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, include-hidden-files: true, retention-days: 3 }

  # Envoie dist/ sur l'hébergement Infomaniak (FTPS) à chaque modification de main,
  # y compris celles faites depuis l'admin. Ne s'exécute que si les secrets sont configurés.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ]; then
            echo "Secrets FTP absents : déploiement ignoré (voir docs/ARCHITECTURE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { name: dist, path: dist }
      - name: Envoyer sur Infomaniak (FTPS)
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Dossier du site sur l'hébergement, avec « / » final. Par défaut : web/
          server-dir: ${{ secrets.FTP_DIR || 'web/' }}
          exclude: |
            **/.well-known/**
